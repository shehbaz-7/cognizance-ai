apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app
  labels:
    app: nextjs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      containers:
        - name: nextjs-app
          # NOTE: Replace the image URI with your actual ECR repository URL
          # You can get this by running: terraform output ecr_repository_url
          image: 285229572098.dkr.ecr.ap-south-2.amazonaws.com/cognizance-app-prod:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
